name: data-pipeline

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "tests/**", "data/source/**", "parsers/**", ".github/workflows/data-pipeline.yml"]

permissions:
  contents: write

concurrency:
  group: data-pipeline
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Unit tests (rate limiter, robots, parsers, schemas)
        run: pytest -q

      - name: Pipeline smoke run against test districts (offline, no network)
        run: |
          cents audit --state NC \
            --districts tests/fixtures/districts.json \
            --parser parsers/generic_directory.yaml \
            --mock-site tests/fixtures/site \
            --rate 1 --output json --out-dir out/smoke \
            --contacts-out out/private/contacts.json
          cents validate out/smoke/nc_audit.json

      - name: Export public datasets from coded responses
        run: |
          cents export --coded data/source/nc_coded_responses.json --out-dir data --stem nc_audit --formats json,csv,parquet
          cents validate data/nc_audit.json

      - name: Refuse to publish personal data
        run: |
          if grep -rIlE "[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}" data/nc_audit.json data/nc_audit.csv; then
            echo "email address found in public dataset"; exit 1
          fi

      - name: Commit refreshed datasets
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nc_audit.json data/nc_audit.csv data/nc_audit.parquet
          if git diff --cached --quiet; then echo "no data changes"; else
            git commit -m "data: refresh NC audit datasets"
            git push
          fi
