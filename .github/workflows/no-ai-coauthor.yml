name: no-ai-coauthor
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: |
          if git log --format=%B | grep -iE '^Co-authored-by:.*(claude|anthropic)|^Claude-Session:'; then
            echo "::error::Commit message contains Claude co-author trailer"; exit 1
          fi
