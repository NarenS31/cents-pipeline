[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cents-pipeline"
version = "0.1.0"
description = "Polite public-records discovery and K-8 financial literacy audit pipeline"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["typer>=0.12", "httpx>=0.27", "pydantic>=2.6", "pyyaml>=6", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.5", "pyarrow>=15"]

[project.scripts]
cents = "cents.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["C408", "RUF007", "E701", "E702"]
