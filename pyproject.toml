[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "cents-pipeline"
dynamic = ["version", "description"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "httpx>=0.24.0",
  "pydantic>=2.0.0",
  "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
cli = ["typer>=0.12", "pyyaml>=6"]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "typer>=0.12", "pyyaml>=6", "pyarrow>=15", "ruff>=0.5"]

[project.scripts]
cents = "cents_pipeline.cli:app"

[tool.flit.module]
name = "cents_pipeline"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["C408", "RUF007", "E701", "E702"]
